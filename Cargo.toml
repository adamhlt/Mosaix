[package]
name = "mosaix"
version = "0.1.0"
edition = "2021"
description = "Cartographie haute résolution d'objets plats au microscope (capture + assemblage en direct)"
license = "GPL-3.0-or-later"

[lib]
name = "mosaix"
path = "src/lib.rs"

[[bin]]
name = "mosaix"
path = "src/main.rs"
required-features = ["ui"]

[features]
default = ["ui", "camera"]
# Rune UI and the self-updater (disable to test the core logic only: --no-default-features)
ui = ["dep:rune", "dep:ureq", "dep:sha2", "dep:zip", "dep:flate2", "dep:tar"]
# nokhwa camera backend (Media Foundation on Windows)
camera = ["dep:nokhwa", "dep:v4l", "dep:nokhwa-bindings-macos"]

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
nokhwa = { version = "0.10.11", features = ["input-native"], optional = true }
# Updates: query GitHub releases, download the asset, check it, unpack it.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"], optional = true }
sha2 = { version = "0.10", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
rune = { git = "https://github.com/anomalyco/rune", rev = "1dba3423fd1f1904553422e7814700f817abe8af", features = ["native-file-dialog"], optional = true }

# macOS: lists a camera's formats straight from AVFoundation (same crate nokhwa uses).
[target.'cfg(target_os = "macos")'.dependencies]
nokhwa-bindings-macos = { version = "0.2.4", optional = true }

# Linux: sets a whole frame rate on the device before nokhwa opens it (same crate nokhwa uses).
[target.'cfg(target_os = "linux")'.dependencies]
v4l = { version = "0.14", optional = true }

[profile.dev]
# La FFT et le laplacien sont inutilisables en debug non optimisé
opt-level = 2

# Rune embarque des versions patchées de quelques crates (vendor/ dans son dépôt) ;
# un [patch] de dépendance ne se propage pas, il faut donc le répéter ici.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "1dba3423fd1f1904553422e7814700f817abe8af" }
winit = { git = "https://github.com/anomalyco/rune", rev = "1dba3423fd1f1904553422e7814700f817abe8af" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "1dba3423fd1f1904553422e7814700f817abe8af" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "1dba3423fd1f1904553422e7814700f817abe8af" }

[build-dependencies]
winresource = "0.1"
